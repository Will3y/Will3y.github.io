<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le planning de Willyam et Hailey</title>
<!-- Écran d'accueil (tablette, téléphone) et hors ligne : ne sert que sur la version en ligne, sans effet en double-clic. -->
<meta name="theme-color" content="#eef1f6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planning">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Même monde d'autocollants que les missions. Un côté par enfant, chacun sa couleur : bleu pour Willyam, rose pour Hailey. */
  --bg:#eef1f6; --paper:#ffffff; --ink:#1b2632; --muted:#56636f;
  --star:#ffc226; --star-soft:#fff1c7; --ok:#1c9e61; --ok-soft:#d5f2e3; --bad:#d93b45; --bad-soft:#fde1e2;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Andika","Comic Sans MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid #4c5ff5;outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 48px}
.sticker{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:10px 16px;font-family:var(--display);font-weight:600;font-size:18px;transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.go{background:var(--star)}
.btn.small{padding:6px 10px;font-size:16px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.btn:disabled{opacity:.4;cursor:default}

/* En-tête : la date du jour, l'heure, et l'entrée de l'espace parent */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,4.6vw,36px);line-height:1.1;flex:1 1 260px;min-width:0}
.top h1 small{display:block;font-family:var(--body);font-weight:400;font-size:16px;color:var(--muted);margin-top:2px}
.clock{font-family:var(--display);font-weight:700;font-size:clamp(22px,4vw,30px);font-variant-numeric:tabular-nums;padding:4px 14px;border-radius:999px;border:3px solid var(--ink);background:var(--paper)}
.gear{width:48px;height:48px;padding:0;font-size:22px}
/* Étiquette du type de journée : jour d'école, jour sans école ou vacances. Se touche pour changer. */
.daytype{font-size:clamp(16px,2.4vw,20px);padding:8px 14px;border-radius:999px;background:var(--star-soft)}
.daytype.home{background:var(--ok-soft)}

/* Sur un petit écran, un seul enfant à la fois : ces deux boutons changent de côté */
.switch{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.switch .btn{font-size:20px;padding:10px 8px}
.switch .btn[aria-pressed="true"]{background:var(--c-soft)}
.switch .btn[aria-pressed="false"]{box-shadow:0 2px 0 var(--ink);transform:translateY(2px);opacity:.75}

.kids{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px;align-items:start}
.kid{padding:16px;position:relative;overflow:hidden}
[data-kid="w"]{--c:#4c5ff5;--c-soft:#e0e4ff;--on-c:#fff}
[data-kid="h"]{--c:#ff5fa2;--c-soft:#ffe0ee;--on-c:#1b2632}
.khead{display:flex;align-items:center;gap:12px}
.avatar{width:60px;height:60px;flex:none;border-radius:50%;border:3px solid var(--ink);background:var(--c);display:grid;place-items:center;font-size:32px;line-height:1}
.khead h2{font-family:var(--display);font-weight:700;font-size:clamp(26px,3.6vw,34px);line-height:1.1;flex:1;min-width:0;overflow-wrap:anywhere}
.count{font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}

/* Les routines du jour */
.chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{flex:1 1 0;min-width:96px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px;border:3px solid var(--ink);border-radius:16px;background:var(--paper);font-family:var(--display);font-weight:600;font-size:17px;line-height:1.15;box-shadow:0 2px 0 var(--ink);opacity:.8}
.chip .ci{font-size:26px;line-height:1}
.chip small{font-family:var(--body);font-weight:700;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-selected="true"]{background:var(--c-soft);box-shadow:0 4px 0 var(--ink);opacity:1;transform:translateY(-2px)}
.chip.full small{color:var(--ok)}
.bar{height:16px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);transition:width .35s}
.bar.full i{background:var(--ok)}

/* Les tâches : une grande ligne à toucher par tâche */
.tasks{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.task{display:flex;gap:8px;align-items:stretch}
.tbtn{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;min-height:74px;border:3px solid var(--ink);border-radius:18px;background:var(--paper);box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.tbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ti{font-size:40px;line-height:1;flex:none;width:48px;text-align:center}
.tn{flex:1;min-width:0;font-family:var(--display);font-weight:600;font-size:clamp(19px,2.3vw,24px);line-height:1.2;overflow-wrap:anywhere}
.chk{flex:none;width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;background:var(--paper)}
.chk svg{width:28px;height:28px;opacity:0;transform:scale(.3);transition:opacity .15s,transform .2s}
.task.done .tbtn{background:var(--ok-soft)}
.task.done .chk{background:var(--ok)}
.task.done .chk svg{opacity:1;transform:none}
.task.pop .chk{animation:pop .4s}
/* Tâche verrouillée : grisée, avec un cadenas, tant que les tâches d'avant ne sont pas cochées */
.task.locked .tbtn{background:#e3e7ee;box-shadow:0 2px 0 var(--ink);transform:translateY(2px)}
.task.locked .ti,.task.locked .tn{opacity:.5}
.task.locked .chk{font-size:22px;background:#e3e7ee}
.tn small{display:block;font-family:var(--body);font-weight:700;font-size:15px}
@keyframes pop{50%{transform:scale(1.3)}}
.say{flex:none;width:52px;border:3px solid var(--ink);border-radius:16px;background:var(--star-soft);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center}
.say svg{width:24px;height:24px}
.note{margin-top:14px;padding:14px;border-radius:16px;background:var(--c-soft);font-family:var(--display);font-weight:600;font-size:20px;text-align:center}
.note.win{background:var(--ok-soft)}
.note .big{display:block;font-size:44px;line-height:1.1}

/* Alertes : le prochain rendez-vous de la journée, puis un grand message à l'heure dite */
.next{margin-top:14px;padding:8px 16px;border:3px solid var(--ink);border-radius:16px;background:var(--paper);font-family:var(--display);font-weight:600;font-size:clamp(19px,2.6vw,24px);text-align:center}
.next b{font-variant-numeric:tabular-nums}
.next small{font-family:var(--body);font-weight:700;font-size:16px;color:var(--muted)}
.next.soon{background:var(--star)}
.next.soon small{color:var(--ink)}
.alarm{position:fixed;inset:0;z-index:40;background:rgba(255,194,38,.94);display:grid;place-items:center;padding:16px;overflow:auto}
.acard{padding:26px 20px;display:grid;gap:18px;justify-items:center;text-align:center;width:min(620px,100%)}
.aitem{display:grid;gap:4px;justify-items:center}
.aicon{font-size:clamp(80px,18vw,130px);line-height:1;animation:shake 1s ease-in-out infinite}
.awhen{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,38px);color:var(--bad)}
.aname{font-family:var(--display);font-weight:700;font-size:clamp(32px,7vw,56px);line-height:1.1;overflow-wrap:anywhere}
.acard .btn{font-size:26px;padding:14px 28px}
@keyframes shake{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}

.cf{position:absolute;top:-20px;width:10px;height:14px;z-index:5;animation:fall 2.2s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(900px) rotate(720deg)}}

/* Espace parent */
.parent{padding:20px 18px;display:grid;gap:14px;margin-top:16px}
.parent h2{font-family:var(--display);font-size:28px}
.parent h3{font-family:var(--display);font-size:22px;margin-top:10px}
.parent h4{font-family:var(--display);font-size:19px;margin:0}
.hint{color:var(--muted);font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs2 .btn[aria-pressed="true"]{background:var(--c-soft)}
.tabs2 .btn[aria-pressed="false"]{box-shadow:0 2px 0 var(--ink);transform:translateY(2px);opacity:.75}
.rbox{border:3px solid var(--ink);border-radius:16px;padding:12px;display:grid;gap:10px;background:var(--c-soft)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.day{width:42px;height:42px;border:3px solid var(--ink);border-radius:50%;background:var(--paper);font-family:var(--display);font-weight:700;font-size:16px;padding:0}
.day[aria-pressed="true"]{background:var(--c);color:var(--on-c)}
.edit{display:grid;grid-template-columns:70px 1fr auto auto auto auto auto 210px;gap:6px;align-items:center}
input,select,textarea{font:inherit;font-size:18px;border:3px solid var(--ink);border-radius:12px;padding:8px;background:var(--paper);color:var(--ink);min-width:0;width:100%}
.edit .btn{width:42px;height:42px;padding:0}
.edit .lk[aria-pressed="true"],.edit .sc[aria-pressed="true"],.asc[aria-pressed="true"]{background:var(--star)}
.edit .lk[aria-pressed="false"],.edit .sc[aria-pressed="false"]{opacity:.4}
.asc[aria-pressed="false"]{opacity:.6}
.abox{border:3px solid var(--ink);border-radius:16px;padding:12px;display:grid;gap:10px;background:var(--star-soft)}
.aedit{display:grid;grid-template-columns:130px 70px 1fr 200px auto auto;gap:6px;align-items:center}
.aedit .adel{width:42px;height:42px;padding:0}
.aedit .atry{white-space:nowrap}
.pinrow input{width:120px;letter-spacing:.3em}
.pinrow select{width:auto;max-width:100%}
/* Mode nuit : tout l'écran en noir, avec l'heure en très sombre. Passe sous les alertes, qui restent visibles. */
.night{position:fixed;inset:0;z-index:35;width:100%;border:0;padding:0;background:#000;display:grid;place-items:center}
.night span{display:block;text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(44px,12vw,96px);line-height:1.1;color:#333;font-variant-numeric:tabular-nums}
.night small{display:block;font-family:var(--body);font-weight:400;font-size:16px;color:#2b2b2b;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{padding:6px 8px;text-align:center;border-bottom:2px solid #d8dee6;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
td.fullc{color:var(--ok);font-weight:700}
.savebox{font-size:14px;resize:vertical;word-break:break-all}
.pindots{display:flex;gap:14px;justify-content:center}
.pindots span{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink)}
.pindots span.f{background:var(--ink)}
.overlay{position:fixed;inset:0;background:rgba(27,38,50,.55);display:grid;place-items:center;padding:16px;z-index:30}
.modal{padding:22px 18px;display:grid;gap:14px;justify-items:center;width:min(360px,100%)}
.modal h2{font-family:var(--display);font-size:24px;text-align:center}
.modal .wide{width:100%;font-size:20px}
.modal .wide[aria-pressed="true"]{background:var(--star)}
.modal .hint{text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.pad .btn{font-size:26px;min-height:58px}

@media (max-width:759px){
  .switch{display:grid}
  .kids{grid-template-columns:1fr}
  body[data-show="w"] .kid[data-kid="h"],body[data-show="h"] .kid[data-kid="w"]{display:none}
  .edit{grid-template-columns:64px 1fr auto auto auto auto auto}
  .edit .ef{grid-column:1/-1}
  .aedit{grid-template-columns:130px 70px 1fr auto}
  .aedit .an{grid-column:1/-1;grid-row:2}
  .aedit .al{grid-column:1/3;grid-row:3}
  .aedit .atry{grid-column:3/-1;grid-row:3}
  .aedit .adel{grid-column:4;grid-row:1;justify-self:end}
}
@media (max-width:430px){.tbtn{gap:8px;padding:10px}.ti{font-size:32px;width:36px}.chk{width:38px;height:38px}.chk svg{width:22px;height:22px}.say{width:44px}}
/* Petit écran : l'image et le nom sur une ligne, les cinq boutons sur la suivante, la fréquence en dessous */
@media (max-width:640px){
  .edit{grid-template-columns:repeat(10,1fr)}
  .edit .ei{grid-column:span 3}
  .edit .en{grid-column:span 7}
  .edit .btn{grid-column:span 2;width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-show="w">
<main class="wrap" id="view"></main>
<div id="layer"></div>
<div id="alarm"></div>
<div id="night"></div>
<script>
/* ---------- Outils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pad2=n=>String(n).padStart(2,'0');
const dayKey=(d=new Date())=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const dayIdx=(d=new Date())=>(d.getDay()+6)%7;                 // 0 = lundi … 6 = dimanche
// Un jour sur deux : les jours « a » et « b » alternent, d'après le numéro du jour dans le calendrier (pas de saut au changement de mois).
const dayAlt=(d=new Date())=>Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)%2===0?'a':'b';
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes();};
const hhmm=m=>`${Math.floor(m/60)} h ${pad2(m%60)}`;
const uid=()=>'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const canSpeak=typeof window!=='undefined'&&'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';
const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function speak(t){if(!canSpeak)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.9;speechSynthesis.speak(u);}catch(e){}}
const checkSvg='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const speakSvg='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';

/* ---------- Données ---------- */
// Trois routines par jour et par enfant. Chaque routine a ses jours (lundi → dimanche) et sa liste de tâches.
const ROUTINES=[{id:'matin',name:'Matin',icon:'☀️',done:'du matin'},{id:'ecole',name:'Après l’école',icon:'🎒',done:'d’après l’école'},{id:'soir',name:'Soir',icon:'🌙',done:'du soir'}];
const KIDS=['w','h'];
const DAY_LETTERS=['L','M','M','J','V','S','D'],DAY_NAMES=['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
const ICONS=['🛏️','🥣','🥐','🥛','🍽️','🍎','🧃','👕','👗','👖','🧦','👟','🧥','🪥','🧼','🚿','🛁','🚽','💇','👓','💊','🎒','📚','✏️','📖','📝','🧹','🧺','🧸','🗑️','🌱','🐶','🐱','🎹','⚽','🎨','📺','🎮','🤗','😴','🌙','⭐','⏰','🔔','🚌','🚗','🏫'];
const T=(icon,name,alt,lock)=>{const t={id:uid(),icon,name};if(alt)t.alt=alt;if(lock)t.lock=true;return t;};
// Tâche « jour d'école » : elle ne s'affiche pas les jours sans école (mercredi, week-end, vacances…).
const E=(icon,name)=>Object.assign(T(icon,name),{school:true});
const ALL=[true,true,true,true,true,true,true],SCHOOL=[true,true,false,true,true,false,false];
// Alertes : une heure (en minutes depuis minuit), des jours, et un rappel facultatif quelques minutes avant. Communes aux deux enfants.
const LEADS=[0,5,10,15];
function defaults(){return {v:1,cut:[720,1110],pin:'',awake:false,night:{mode:'black',from:1260,to:390},lastExport:'',log:{},school:SCHOOL.slice(),holiday:false,alerts:[{id:uid(),t:500,icon:'🚌',name:'Départ à l’école',lead:5,days:SCHOOL.slice(),school:true}],kids:{
  w:{name:'Willyam',avatar:'🧒',routines:{
    matin:{days:ALL.slice(),tasks:[E('🛏️','Je fais mon lit'),T('🥣','Je prends mon petit-déjeuner'),E('👕','Je m’habille'),T('🪥','Je me brosse les dents'),E('🎒','Je prépare mon cartable'),E('👟','Je mets mes chaussures')]},
    ecole:{days:SCHOOL.slice(),tasks:[T('🧼','Je me lave les mains'),T('🍎','Je prends mon goûter'),T('🎒','Je vide mon cartable'),T('📚','Je fais mes devoirs'),T('🧸','Je range mes affaires')]},
    soir:{days:ALL.slice(),tasks:[T('🚿','Je prends ma douche'),T('👕','Je mets mon pyjama'),T('🍽️','Je mets la table','a'),T('🧹','Je débarrasse la table','b'),T('🪥','Je me brosse les dents'),T('🎒','Je prépare mes affaires pour demain'),T('📖','Je lis une histoire','',true),T('🌙','Au lit !')]}}},
  h:{name:'Hailey',avatar:'👧',routines:{
    matin:{days:ALL.slice(),tasks:[T('🥣','Je prends mon petit-déjeuner'),E('👗','Je m’habille'),T('🪥','Je me brosse les dents'),T('🚽','Je vais aux toilettes'),E('👟','Je mets mes chaussures')]},
    ecole:{days:SCHOOL.slice(),tasks:[T('🧼','Je me lave les mains'),T('🍎','Je prends mon goûter'),T('🧸','Je range mes jouets')]},
    soir:{days:ALL.slice(),tasks:[T('🛁','Je prends mon bain'),T('👗','Je mets mon pyjama'),T('🍽️','Je mange'),T('🧹','Je débarrasse la table','a'),T('🍽️','Je mets la table','b'),T('🪥','Je me brosse les dents'),T('🚽','Je vais aux toilettes'),T('📖','On lit une histoire','',true),T('🌙','Au lit !')]}}}}};}

const STORE='planning-famille-v1';
// Remet un état lu (mémoire de l'appareil ou sauvegarde importée) dans une forme sûre : tout ce qui manque reprend la valeur par défaut.
// La nuit, avec « Écran toujours allumé » : écran noir (black), veille normale de la tablette (off), ou rien de spécial (none).
const NIGHT_MODES=['black','off','none'];
function clean(d){
  const def=defaults(),o={v:1,cut:def.cut.slice(),pin:'',awake:false,night:def.night,lastExport:'',log:{},school:def.school,holiday:false,alerts:def.alerts,kids:{}};
  if(!d||typeof d!=='object')return def;
  // Planning enregistré avant l'arrivée des « jours d'école » : les jours d'école sont ceux où la routine d'après l'école
  // s'affichait, et on marque une fois pour toutes le départ à l'école et, le matin, les tâches de départ qui servent à partir.
  const old=!Array.isArray(d.school),OLD_SCHOOL=['Je fais mon lit','Je m’habille','Je prépare mon cartable','Je mets mes chaussures'];
  const was=old&&d.kids&&d.kids.w&&d.kids.w.routines&&d.kids.w.routines.ecole&&d.kids.w.routines.ecole.days,from=old?was:d.school;
  if(Array.isArray(from)&&(!old||from.some(x=>x===true)))o.school=Array.from({length:7},(_,i)=>from[i]===true);
  o.holiday=d.holiday===true;
  const int=(v,a,b,dv)=>Number.isFinite(+v)&&v!==null&&v!==''?clamp(Math.round(+v),a,b):dv;

      ${r.id==='ecole'?'<p class="hint">S’affiche les jours d’école, réglés plus bas dans « Jours d’école ».</p>':`<div class="days" role="group" aria-label="Jours de la routine ${r.name}">${DAY_LETTERS.map((l,i)=>`<button class="day" data-d="${i}" aria-pressed="${ro.days[i]}" aria-label="${DAY_NAMES[i]}">${l}</button>`).join('')}</div>`}
      ${ro.tasks.map((x,i)=>`<div class="edit" data-i="${i}"><select class="ei" aria-label="Image de la tâche">${opts(x.icon)}</select><input class="en" value="${esc(x.name)}" maxlength="48" aria-label="Nom de la tâche"><button class="btn small up" aria-label="Monter ${esc(x.name)}" ${i===0?'disabled':''}>↑</button><button class="btn small down" aria-label="Descendre ${esc(x.name)}" ${i===ro.tasks.length-1?'disabled':''}>↓</button><button class="btn small del" aria-label="Supprimer ${esc(x.name)}">✕</button><button class="btn small lk" aria-pressed="${!!x.lock}" aria-label="Verrouiller ${esc(x.name)} tant que les tâches d’avant ne sont pas faites">🔒</button><button class="btn small sc" aria-pressed="${r.id==='ecole'||!!x.school}" ${r.id==='ecole'?'disabled':''} aria-label="Afficher ${esc(x.name)} seulement les jours d’école">🎒</button><select class="ef" aria-label="Fréquence de ${esc(x.name)}">${freq(x.alt)}</select></div>`).join('')}
      <div class="row"><button class="btn small add" ${ro.tasks.length>=20?'disabled':''}>+ Ajouter une tâche</button></div></div>`;}).join('')}
    <div class="row"><button class="btn small" id="uncheck">Tout décocher aujourd’hui pour ${esc(K.name)}</button><button class="btn small" id="defTasks">Remettre les tâches de départ de ${esc(K.name)}</button></div>
    <h3>Les 7 derniers jours de ${esc(K.name)}</h3>
    <table><thead><tr><th>Jour</th>${ROUTINES.map(r=>`<th>${r.icon} ${r.name}</th>`).join('')}</tr></thead><tbody>${hist()}</tbody></table>
    <h3>Jours d’école</h3>
    <p class="hint">Les jours colorés sont des jours d’école. Les autres jours, et pendant les vacances, la routine « Après l’école » et les tâches et alertes marquées 🎒 ne s’affichent pas : la journée est plus légère. Pour un jour particulier (jour férié, enfant malade), touche l’étiquette « Jour d’école » en haut du planning.</p>
    <div class="days" id="schoolDays" role="group" aria-label="Jours d’école">${DAY_LETTERS.map((l,i)=>`<button class="day" data-d="${i}" aria-pressed="${S.school[i]}" aria-label="${DAY_NAMES[i]}">${l}</button>`).join('')}</div>
    <div class="row"><button class="btn small" id="holiday">${S.holiday?'🏖️ Vacances : activées ✓':'🏖️ Vacances : désactivées'}</button></div>
    <h3>Horaires</h3>
    <p class="hint">Le planning ouvre tout seul la routine du moment. Les enfants peuvent quand même toucher une autre routine pour la voir.</p>
    <div class="row pinrow"><span>« Après l’école » à partir de</span><select id="cut0" aria-label="Début de l’après-midi">${times(600,960,S.cut[0])}</select><span>« Soir » à partir de</span><select id="cut1" aria-label="Début du soir">${times(Math.max(960,S.cut[0]+60),1320,S.cut[1])}</select></div>
    <h3>Alertes</h3>
    <p class="hint">À l’heure choisie, le planning affiche un grand message, sonne et le lit à voix haute. Les alertes sont les mêmes pour les deux enfants. Avec un rappel, il y a un premier message quelques minutes avant.</p>
    <p class="hint">Elles ne sonnent que si le planning est affiché, écran allumé : active « Écran toujours allumé » juste en dessous et laisse la tablette branchée. Pour le son, il faut que l’écran ait été touché au moins une fois depuis l’ouverture du planning.</p>
    ${S.alerts.map((a,i)=>`<div class="abox" data-a="${i}"><div class="aedit"><input type="time" class="at" value="${pad2(Math.floor(a.t/60))}:${pad2(a.t%60)}" aria-label="Heure de l’alerte ${esc(a.name)}"><select class="ai" aria-label="Image de l’alerte">${opts(a.icon)}</select><input class="an" value="${esc(a.name)}" maxlength="40" aria-label="Nom de l’alerte"><select class="al" aria-label="Rappel avant ${esc(a.name)}">${LEADS.map(l=>`<option value="${l}" ${l===a.lead?'selected':''}>${l?`Rappel ${l} min avant`:'Sans rappel'}</option>`).join('')}</select><button class="btn small atry">🔔 Essayer</button><button class="btn small adel" aria-label="Supprimer l’alerte ${esc(a.name)}">✕</button></div>
      <div class="days" role="group" aria-label="Jours de l’alerte ${esc(a.name)}">${DAY_LETTERS.map((l,j)=>`<button class="day" data-d="${j}" aria-pressed="${a.days[j]}" aria-label="${DAY_NAMES[j]}">${l}</button>`).join('')}<button class="btn small asc" aria-pressed="${!!a.school}">🎒 Jours d’école seulement</button></div></div>`).join('')}
    <div class="row"><button class="btn small" id="aadd" ${S.alerts.length>=10?'disabled':''}>+ Ajouter une alerte</button></div>
    <h3>Écran</h3>
    <p class="hint">Pour laisser la tablette posée comme un tableau : l’écran reste allumé tant que le planning est affiché. Ne marche pas sur tous les appareils, et consomme de la batterie.</p>
    <div class="row"><button class="btn small" id="awake">${S.awake?'Écran toujours allumé : activé ✓':'Écran toujours allumé : désactivé'}</button></div>
    ${S.awake?`<div class="row pinrow"><span>La nuit, de</span><select id="nFrom" aria-label="Début de la nuit">${times(1080,1410,S.night.from)}</select><span>à</span><select id="nTo" aria-label="Fin de la nuit">${times(240,600,S.night.to)}</select></div>
    <div class="row"><select id="nMode" aria-label="Écran pendant la nuit">${[['black','Écran noir, qui revient tout seul le matin'],['off','Écran éteint par la tablette, à rallumer à la main le matin'],['none','Rien : allumé jour et nuit']].map(([v,t])=>`<option value="${v}" ${S.night.mode===v?'selected':''}>${t}</option>`).join('')}</select></div>
    <p class="hint"><b>Écran noir</b> : la nuit, le planning devient tout noir, avec l’heure en très sombre, et il revient tout seul le matin. Toucher l’écran l’affiche pendant 3 minutes. L’écran n’est pas vraiment éteint (une page web ne peut ni éteindre ni rallumer une tablette) : pour qu’il éclaire le moins possible, active la luminosité automatique dans les réglages de la tablette.</p>
    <p class="hint"><b>Écran éteint par la tablette</b> : la nuit, le planning laisse la tablette se mettre en veille comme d’habitude. C’est vraiment éteint, mais il faut appuyer sur le bouton de la tablette le matin, et les alertes ne sonnent pas tant que l’écran est éteint.</p>`:''}
    <h3>Code parent</h3>
    <p class="hint">${S.pin?'Le code protège cet espace.':'Optionnel : avec un code à 4 chiffres, les enfants ne peuvent plus ouvrir cet espace.'}</p>
    <div class="row pinrow"><input id="pinIn" type="password" inputmode="numeric" maxlength="4" placeholder="••••" aria-label="Nouveau code à 4 chiffres"><button class="btn small" id="pinSave">${S.pin?'Changer le code':'Enregistrer le code'}</button>${S.pin?'<button class="btn small" id="pinDel">Supprimer le code</button>':''}</div>
    <p class="hint" id="pinMsg" aria-live="polite"></p>
    <h3>Sauvegarde</h3>
    <p class="hint">Le planning est gardé sur cet appareil. Pour le copier sur un autre appareil : copie le code ici, puis colle-le là-bas et touche « Importer ». Les tâches, les jours et l’historique sont transférés.</p>
    <div class="row"><button class="btn small" id="expCopy">Copier le code</button></div>
    <textarea class="savebox" id="expOut" rows="3" readonly hidden aria-label="Code de sauvegarde"></textarea>
    <textarea class="savebox" id="impIn" rows="3" placeholder="Pour importer : colle le code ici" aria-label="Code à importer"></textarea>
    <div class="row"><button class="btn small" id="impBtn">Importer le code</button></div>
    <p class="hint" id="saveMsg" aria-live="polite"></p>
    <h3>Comment s’en servir</h3>
    <ul class="hint"><li>Sur la tablette : ouvre la page dans Chrome, touche ⋮ puis « Ajouter à l’écran d’accueil ». L’icône ouvre le planning en plein écran, même sans Internet.</li>
    <li>Pour qu’un enfant ne sorte pas du planning : épingle l’application (Paramètres → Sécurité → Épinglage d’application).</li>
    <li>Une tâche se coche en la touchant, et se décoche en la touchant encore. Le haut-parleur lit la tâche à voix haute.</li>
    <li>Les jours sans école, le planning est plus court : seules les tâches sans cartable 🎒 s’affichent. L’étiquette en haut du planning dit quel jour on est.</li>
    <li>Tout repart de zéro chaque matin. Peu de tâches, toujours dans le même ordre : c’est ce qui marche le mieux.</li></ul>
    <div class="row"><button class="btn go" id="back">← Retour au planning</button></div></div>`;
  window.scrollTo(0,0);
  const again=keep=>{const y=window.scrollY;renderParent();if(keep)window.scrollTo(0,y);};
  document.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{parentKid=b.dataset.pk;renderParent();});
  $('#kname').onchange=e=>{K.name=e.target.value.trim().slice(0,20)||defaults().kids[kid].name;save();again(true);};
  document.querySelectorAll('.rbox').forEach(box=>{
    const ro=routine(kid,box.dataset.r),touch=()=>{snapshot(kid);save();};
    box.querySelectorAll('.day').forEach(b=>b.onclick=()=>{const i=+b.dataset.d;ro.days[i]=!ro.days[i];b.setAttribute('aria-pressed',ro.days[i]);touch();});
    box.querySelectorAll('.edit').forEach(row=>{
      const i=+row.dataset.i,x=ro.tasks[i];
      row.querySelector('.ei').onchange=e=>{x.icon=e.target.value;touch();};
      row.querySelector('.en').onchange=e=>{x.name=e.target.value.trim().slice(0,48)||'Nouvelle tâche';e.target.value=x.name;touch();};
      row.querySelector('.ef').onchange=e=>{if(e.target.value)x.alt=e.target.value;else delete x.alt;touch();};
      row.querySelector('.lk').onclick=e=>{if(x.lock)delete x.lock;else x.lock=true;e.currentTarget.setAttribute('aria-pressed',!!x.lock);touch();};
      row.querySelector('.sc').onclick=e=>{if(x.school)delete x.school;else x.school=true;e.currentTarget.setAttribute('aria-pressed',!!x.school);touch();};
      row.querySelector('.up').onclick=()=>{if(i>0){[ro.tasks[i-1],ro.tasks[i]]=[ro.tasks[i],ro.tasks[i-1]];touch();again(true);}};
      row.querySelector('.down').onclick=()=>{if(i<ro.tasks.length-1){[ro.tasks[i+1],ro.tasks[i]]=[ro.tasks[i],ro.tasks[i+1]];touch();again(true);}};
      row.querySelector('.del').onclick=()=>{ro.tasks.splice(i,1);touch();again(true);};
    });
    box.querySelector('.add').onclick=()=>{if(ro.tasks.length>=20)return;ro.tasks.push({id:uid(),icon:'⭐',name:'Nouvelle tâche'});touch();again(true);const ins=document.querySelectorAll(`.rbox[data-r="${box.dataset.r}"] .en`),last=ins[ins.length-1];if(last){last.focus();last.select();}};
  });
  const arm=(btn,key,label,fn)=>{btn.onclick=()=>{if(resetArmed!==key){resetArmed=key;btn.textContent=label;btn.style.background='var(--bad-soft)';return;}fn();};};
  arm($('#uncheck'),'u','Sûr ? Touche encore pour tout décocher',()=>{today()[kid].done={};snapshot(kid);save();again(true);});
  arm($('#defTasks'),'d','Sûr ? Touche encore pour remplacer ses tâches',()=>{K.routines=defaults().kids[kid].routines;snapshot(kid);save();again(true);});
  document.querySelectorAll('#schoolDays .day').forEach(b=>b.onclick=()=>{const i=+b.dataset.d;S.school[i]=!S.school[i];b.setAttribute('aria-pressed',S.school[i]);KIDS.forEach(snapshot);save();});
  $('#holiday').onclick=()=>{S.holiday=!S.holiday;delete today().type;KIDS.forEach(snapshot);save();again(true);};
  $('#cut0').onchange=e=>{S.cut[0]=+e.target.value;if(S.cut[1]<S.cut[0]+60)S.cut[1]=S.cut[0]+60;if(S.cut[1]<960)S.cut[1]=960;save();again(true);};
  $('#cut1').onchange=e=>{S.cut[1]=+e.target.value;save();};
  document.querySelectorAll('.abox').forEach(box=>{
    const i=+box.dataset.a,a=S.alerts[i];
    box.querySelector('.at').onchange=e=>{const v=/^(\d{2}):(\d{2})/.exec(e.target.value);if(v){a.t=clamp(+v[1]*60+ +v[2],0,1439);save();}};
    box.querySelector('.ai').onchange=e=>{a.icon=e.target.value;save();};
    box.querySelector('.an').onchange=e=>{a.name=e.target.value.trim().slice(0,40)||'Alerte';e.target.value=a.name;save();};
    box.querySelector('.al').onchange=e=>{a.lead=+e.target.value;save();};
    box.querySelectorAll('.day').forEach(b=>b.onclick=()=>{const j=+b.dataset.d;a.days[j]=!a.days[j];b.setAttribute('aria-pressed',a.days[j]);save();});
    box.querySelector('.atry').onclick=()=>{unlock();ring(a,0);};
    box.querySelector('.asc').onclick=e=>{a.school=!a.school;e.currentTarget.setAttribute('aria-pressed',a.school);save();};
    box.querySelector('.adel').onclick=()=>{S.alerts.splice(i,1);save();again(true);};
  });
  // Une nouvelle alerte est posée à la prochaine heure pleine, pour ne pas sonner tout de suite.
  $('#aadd').onclick=()=>{if(S.alerts.length>=10)return;S.alerts.push({id:uid(),t:Math.min(1439,(Math.floor(nowMin()/60)+1)*60),icon:'⏰',name:'Alerte',lead:0,days:ALL.slice()});save();again(true);const ins=document.querySelectorAll('.abox .an'),last=ins[ins.length-1];if(last){last.focus();last.select();}};
  $('#awake').onclick=()=>{S.awake=!S.awake;save();wake();again(true);};
  if(S.awake){
    $('#nFrom').onchange=e=>{S.night.from=+e.target.value;save();wake();};
    $('#nTo').onchange=e=>{S.night.to=+e.target.value;save();wake();};
    $('#nMode').onchange=e=>{S.night.mode=e.target.value;save();wake();};
  }
  $('#pinSave').onclick=()=>{const v=$('#pinIn').value.trim();if(!/^\d{4}$/.test(v)){$('#pinMsg').textContent='Le code doit faire exactement 4 chiffres.';return;}S.pin=v;save();again(true);$('#pinMsg').textContent='Code enregistré. Retiens-le bien.';};
  if(S.pin)$('#pinDel').onclick=()=>{S.pin='';save();again(true);$('#pinMsg').textContent='Code supprimé.';};
  $('#expCopy').onclick=async()=>{
    const code=exportCode(),out=$('#expOut');out.hidden=false;out.value=code;S.lastExport=new Date().toISOString();save();
    let ok=false;try{await navigator.clipboard.writeText(code);ok=true;}catch(e){out.focus();out.select();}
    $('#saveMsg').textContent=ok?'Code copié. Colle-le dans un message ou une note pour le garder.':'Le code est affiché ci-dessus : sélectionne-le et copie-le.';
  };
  $('#impBtn').onclick=()=>{
    try{const d=parseBackup($('#impIn').value);S=d;save();renderParent();$('#saveMsg').textContent='Planning importé.';}
    catch(e){$('#saveMsg').textContent='Ce code n’est pas valide. Vérifie qu’il est copié en entier.';}
  };
  $('#back').onclick=renderHome;
}

/* ---------- Sauvegarde : export / import ---------- */
// Code = "PLANNING1-" + JSON en base64 (UTF-8).
const toB64=str=>{const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);};
const fromB64=b64=>{const s=atob(b64),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return new TextDecoder().decode(b);};
const exportCode=()=>'PLANNING1-'+toB64(JSON.stringify({app:'planning-famille',v:1,date:new Date().toISOString(),data:S}));
function parseBackup(text){
  const t=String(text||'').trim().replace(/\s+/g,'').replace(/^PLANNING\d+-/i,'');
  const obj=JSON.parse(fromB64(t));
  if(!obj||obj.app!=='planning-famille'||!obj.data||typeof obj.data.kids!=='object')throw new Error('format');
  return clean(obj.data);
}

/* ---------- Mode nuit ---------- */
// Une page web ne peut ni éteindre ni rallumer l'écran. Avec « Écran toujours allumé », elle peut en revanche :
// - soit afficher du noir la nuit et revenir au planning le matin (l'écran reste allumé, mais n'éclaire presque plus) ;
// - soit ne plus retenir l'écran la nuit, pour que la tablette se mette en veille toute seule.
const isNight=()=>{const m=nowMin(),{from,to}=S.night;return from>to?(m>=from||m<to):(m>=from&&m<to);};
const PEEK=3*60000;        // après un toucher, le planning reste visible 3 minutes
let lastTouch=0;
document.addEventListener('pointerdown',()=>{lastTouch=Date.now();},{passive:true});
function nightCheck(){
  const box=$('#night'),on=S.awake&&S.night.mode==='black'&&isNight()&&view==='home'&&Date.now()-lastTouch>=PEEK;
  if(!on){if(box.firstChild)box.innerHTML='';return;}
  if(!box.firstChild){
    box.innerHTML='<button class="night" aria-label="Mode nuit. Toucher pour afficher le planning."><span><b id="nclock"></b><small>Touche l’écran pour voir le planning</small></span></button>';
    box.firstChild.onclick=()=>{lastTouch=Date.now();nightCheck();};
  }
  // L'heure change un peu de place à chaque minute, pour ne pas marquer l'écran.
  const c=$('#nclock'),m=nowMin();c.textContent=hhmm(m);c.parentNode.style.transform=`translate(${(m*37)%61-30}px,${(m*53)%81-40}px)`;
}

/* ---------- Écran toujours allumé ---------- */
let lock=null;
async function wake(){
  try{
    if(S.awake&&!(S.night.mode==='off'&&isNight())&&document.visibilityState==='visible'&&'wakeLock' in navigator){if(!lock){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>{lock=null;});}}
    else if(lock){await lock.release();lock=null;}
  }catch(e){lock=null;}
}

/* ---------- Démarrage ---------- */
KIDS.forEach(snapshot);save();
renderHome();wake();checkAlerts();
setInterval(tick,20000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){tick();wake();}else save();});
window.addEventListener('pagehide',save);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
